<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/crm-flutter/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="crm_mobile_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>crm_mobile_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    async function loadFlutterApp() {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const appRegistrations = registrations.filter((registration) =>
          registration.scope.includes('/crm-flutter/')
        );

        if (appRegistrations.length > 0) {
          await Promise.all(
            appRegistrations.map((registration) => registration.unregister())
          );

          if (
            navigator.serviceWorker.controller &&
            sessionStorage.getItem('crmFlutterSwCleared') !== 'true'
          ) {
            sessionStorage.setItem('crmFlutterSwCleared', 'true');
            window.location.reload();
            return;
          }
        }
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = `flutter_bootstrap.js?v=${Date.now()}`;
      document.body.appendChild(bootstrap);
    }

    loadFlutterApp();
  </script>
</body>
</html>
